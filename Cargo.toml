[package]
name = "agent-tunnel"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Temporary outbound remote execution for local terminal agents"
publish = false

[features]
default = ["controller", "relay", "mcp"]
controller = []
relay = []
mcp = ["controller", "dep:rmcp"]

[dependencies]
base64 = "0.22"
snow = { version = "0.10", default-features = false, features = ["std", "ring-resolver"] }
anyhow = "1.0"
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
libc = "0.2"
rand = "0.8"
rmcp = { version = "3.4", optional = true, default-features = false, features = ["server", "transport-io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1.52", features = ["rt", "macros", "net", "io-util", "io-std", "time", "sync", "process", "signal"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
