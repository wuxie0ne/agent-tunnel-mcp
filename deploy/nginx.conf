# Include this inside http {}. Supply a real certificate and replace the hostname.
# The relay MUST remain loopback-only. Do not log Authorization or request bodies.
map $http_upgrade $agent_tunnel_connection {
    default upgrade;
    '' close;
}
limit_conn_zone $binary_remote_addr zone=agent_tunnel_per_ip:10m;
server {
    listen 443 ssl;
    server_name tunnel.example.invalid;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;
    limit_conn agent_tunnel_per_ip 16;

    location /v1/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $agent_tunnel_connection;
        proxy_read_timeout 75s;
        proxy_send_timeout 15s;
        proxy_buffering off;
        access_log off;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8787;
        access_log off;
    }
    location / { return 404; }
}
